<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1621">
<title>لوحة تحكم Migo — مهامي الآن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1621; --surface:#17212B; --surface2:#1D2A38; --border:#232E3C;
    --gold:#E8B33D; --gold-text:#1A1405; --blue:#2AABEE; --green:#2FBF71;
    --amber:#F5A623; --red:#E53935; --purple:#B392F0;
    --text:#FFFFFF; --muted:#7F91A4;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    background:var(--bg); color:var(--text);
    font-family:"IBM Plex Sans Arabic", -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    font-size:15px; line-height:1.6; padding-bottom:84px;
  }
  .num{font-variant-numeric:tabular-nums; letter-spacing:.2px;}
  header.top{
    position:sticky; top:0; z-index:20; background:var(--bg);
    border-bottom:1px solid var(--border);
    padding:12px 16px; display:flex; align-items:center; gap:10px;
  }
  header.top h1{font-size:19px; font-weight:700; flex:1;}
  .pill{
    display:inline-flex; align-items:center; gap:6px;
    border:1px solid var(--border); background:var(--surface);
    border-radius:999px; padding:4px 12px; font-size:13px; font-weight:600;
    cursor:pointer; color:var(--text); min-height:36px;
  }
  .dot{width:9px; height:9px; border-radius:50%; background:var(--muted); flex:none;}
  .dot.ok{background:var(--green);} .dot.bad{background:var(--red);} .dot.warn{background:var(--amber);}
  main{padding:14px 14px 6px; display:flex; flex-direction:column; gap:14px; max-width:640px; margin:0 auto;}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px;}
  .card h2{font-size:16px; font-weight:700; margin-bottom:10px;}
  .comp-row{display:flex; align-items:center; gap:9px; padding:9px 0; border-top:1px solid var(--border);}
  .comp-row:first-of-type{border-top:none; padding-top:2px;}
  .comp-row .name{font-weight:600; flex:1;}
  .comp-row .meta{color:var(--muted); font-size:13px; text-align:left;}
  .comp-row .meta b{color:var(--text); font-weight:600;}
  .queue-card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:13px 14px; display:flex; align-items:center; gap:12px;
    border-right:5px solid var(--muted);
  }
  .queue-card .lbl{flex:1; font-weight:600; font-size:15px;}
  .queue-card .lbl small{display:block; color:var(--muted); font-weight:400; font-size:12.5px;}
  .queue-card .cnt{font-size:26px; font-weight:700; line-height:1;}
  .queue-card .cnt.na{font-size:14px; color:var(--amber); font-weight:600;}
  .sev-amber{border-right-color:var(--amber);} .sev-red{border-right-color:var(--red);}
  .sev-blue{border-right-color:var(--blue);} .sev-purple{border-right-color:var(--purple);}
  .sev-green{border-right-color:var(--green);}
  .empty{
    text-align:center; color:var(--muted); padding:26px 10px; font-size:16px;
    background:var(--surface); border:1px dashed var(--border); border-radius:14px;
  }
  .empty b{color:var(--green); display:block; font-size:18px; margin-bottom:4px;}
  .topup-row{padding:11px 0; border-top:1px solid var(--border);}
  .topup-row:first-of-type{border-top:none; padding-top:2px;}
  .topup-row .amt{font-size:20px; font-weight:700;}
  .topup-row .amt small{font-size:13px; color:var(--muted); font-weight:500;}
  .topup-row .sub{color:var(--muted); font-size:13.5px;}
  .topup-row .sub b{color:var(--text); font-weight:600;}
  .btn{
    display:block; width:100%; min-height:50px; border:none; border-radius:12px;
    background:var(--gold); color:var(--gold-text); font-family:inherit;
    font-size:16px; font-weight:700; cursor:pointer; padding:10px;
  }
  .btn:disabled{opacity:.55; cursor:default;}
  .btn.secondary{background:var(--surface2); color:var(--text); border:1px solid var(--border);}
  .msg{display:none; border-radius:12px; padding:12px 14px; font-size:14.5px;}
  .msg.err{display:block; background:#2A1416; border:1px solid var(--red); color:#FFD7D5;}
  .msg.warn{display:block; background:#2A2110; border:1px solid var(--amber); color:#FFE1B0;}
  .msg .btn{margin-top:10px;}
  .updated{color:var(--muted); font-size:12.5px; text-align:center;}
  .hidden{display:none !important;}
  nav.bottom{
    position:fixed; bottom:0; right:0; left:0; z-index:30;
    background:var(--surface); border-top:1px solid var(--border);
    display:flex; padding-bottom:env(safe-area-inset-bottom);
  }
  nav.bottom button{
    flex:1; background:none; border:none; color:var(--muted); font-family:inherit;
    font-size:12.5px; font-weight:600; padding:10px 2px 12px; cursor:pointer; min-height:58px;
  }
  nav.bottom button .ic{display:block; font-size:20px; line-height:1.25;}
  nav.bottom button.active{color:var(--gold);}
  .sheet-veil{
    position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:40; display:none;
  }
  .sheet{
    position:fixed; right:0; left:0; bottom:0; z-index:41; display:none;
    background:var(--surface); border-top:1px solid var(--border);
    border-radius:18px 18px 0 0; padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    text-align:center;
  }
  .sheet.open, .sheet-veil.open{display:block;}
  .sheet p{font-size:16px; font-weight:600; margin-bottom:6px;}
  .sheet small{color:var(--muted); display:block; margin-bottom:14px;}
  .msg.ok{display:block; background:#0F2A1A; border:1px solid var(--green); color:#C9F5DC;}
  .badge{
    display:inline-block; font-size:11.5px; font-weight:700; border-radius:999px;
    padding:2px 9px; background:var(--surface2); border:1px solid var(--border); color:var(--muted);
    vertical-align:middle;
  }
  .badge.bot{color:var(--blue); border-color:var(--blue);}
  .badge.store{color:var(--gold); border-color:var(--gold);}
  .search-row{display:flex; gap:8px;}
  .search-row input{
    flex:1; background:var(--surface2); border:1px solid var(--border); border-radius:10px;
    color:var(--text); font-family:inherit; font-size:15px; padding:11px 12px; min-height:50px; min-width:0;
  }
  .search-row .btn{width:auto; padding:10px 20px; flex:none;}
  .result-row{
    display:flex; align-items:center; gap:10px; padding:12px 0;
    border-top:1px solid var(--border); cursor:pointer;
  }
  .result-row:first-of-type{border-top:none; padding-top:2px;}
  .result-row .who{flex:1; min-width:0;}
  .result-row .who b{display:block; font-size:15px; overflow-wrap:anywhere;}
  .result-row .who small{color:var(--muted); font-size:12.5px;}
  .result-row .bal{font-weight:700; font-size:16px; text-align:left;}
  .result-row .bal small{display:block; color:var(--muted); font-weight:400; font-size:12px;}
  .wallet-card .bal-big{font-size:30px; font-weight:700; line-height:1.3;}
  .wallet-card .bal-big small{font-size:14px; color:var(--muted); font-weight:500;}
  .row-actions{display:flex; gap:8px; margin-top:9px; flex-wrap:wrap;}
  .btn.small{display:inline-block; width:auto; min-height:40px; padding:6px 14px; font-size:14px; border-radius:10px;}
  .btn.danger{background:var(--red); color:#FFFFFF;}
  .btn.go{background:var(--green); color:#FFFFFF;}
  .btn.ghost{background:var(--surface2); color:var(--text); border:1px solid var(--border);}
  .btn.back{margin-bottom:2px;}
  .status-txt{font-weight:600; font-size:13px;}
  .st-pending{color:var(--amber);} .st-bad{color:var(--red);} .st-ok{color:var(--green);} .st-mut{color:var(--muted);}
  .sheet.form{text-align:right; max-height:88vh; overflow-y:auto;}
  .sheet.form .btn{margin-top:8px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:13.5px; color:var(--muted); margin-bottom:5px; font-weight:600;}
  .field input, .field select, .field textarea{
    width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:10px;
    color:var(--text); font-family:inherit; font-size:15px; padding:11px 12px; min-height:48px;
  }
  .seg{display:flex; gap:8px;}
  .seg button{
    flex:1; background:var(--surface2); border:1px solid var(--border); border-radius:10px;
    color:var(--text); font-family:inherit; font-size:14.5px; font-weight:600;
    padding:10px 4px; min-height:48px; cursor:pointer;
  }
  .seg button.on{background:var(--gold); color:var(--gold-text); border-color:var(--gold);}
  .preview{
    background:var(--surface2); border:1px solid var(--border); border-radius:10px;
    padding:10px 12px; font-size:14.5px; margin-bottom:12px;
  }
  .preview .warn{color:var(--red); font-weight:600;}
</style>
</head>
<body>

<header class="top">
  <h1 id="pageTitle">مهامي الآن</h1>
  <button class="pill" id="storePill" type="button"><span class="dot" id="storeDot"></span><span id="storePillText">بيحمّل…</span></button>
</header>

<main id="homeMain">
  <div class="msg" id="msgBox"></div>

  <section class="card hidden" id="compCard">
    <h2>حالة الأجزاء</h2>
    <div id="compRows"></div>
  </section>

  <div id="queueWrap" class="hidden" style="display:flex; flex-direction:column; gap:10px;"></div>

  <section class="card hidden" id="topupCard">
    <h2>أحدث شحنات محفظة الموقع المنتظرة</h2>
    <div id="topupRows"></div>
  </section>

  <section class="card hidden" id="botTopupCard">
    <h2>أحدث شحنات البوت المنتظرة</h2>
    <div id="botTopupRows"></div>
  </section>

  <button class="btn" id="refreshBtn" type="button">تحديث</button>
  <div class="updated" id="updatedLine"></div>
</main>

<main id="customersMain" class="hidden">
  <div class="msg" id="custMsg"></div>

  <section class="card" id="custSearchCard">
    <h2>بحث عن عميل</h2>
    <div class="search-row">
      <input id="custQ" type="text" placeholder="رقم عميل، إيميل، رقم عملية، أو رقم طلب">
      <button class="btn" id="custSearchBtn" type="button">بحث</button>
    </div>
    <div class="sub" style="color:var(--muted); font-size:13px; margin-top:8px;">البحث بيدوّر في عملاء البوت وعملاء الموقع بنفس المعرّف.</div>
    <div id="custResults" style="margin-top:6px;"></div>
  </section>

  <div id="custFile" class="hidden" style="display:flex; flex-direction:column; gap:14px;"></div>
</main>

<div class="sheet-veil" id="sheetVeil"></div>
<div class="sheet" id="sheet">
  <p id="sheetTitle"></p>
  <small>القسم ده هيتبني في مرحلته الجاية من خطة اللوحة.</small>
  <button class="btn secondary" id="sheetClose" type="button">تمام</button>
</div>

<div class="sheet-veil" id="actVeil"></div>
<div class="sheet form" id="actSheet">
  <p id="actTitle"></p>
  <div id="actBody"></div>
  <div class="msg" id="actMsg"></div>
  <button class="btn" id="actConfirm" type="button">تأكيد</button>
  <button class="btn secondary" id="actCancel" type="button">إلغاء</button>
</div>

<nav class="bottom" id="bottomNav">
  <button type="button" class="active" data-nav="home"><span class="ic">🏠</span>مهامي الآن</button>
  <button type="button" data-nav="events"><span class="ic">🔔</span>الأحداث</button>
  <button type="button" data-nav="orders"><span class="ic">📦</span>الطلبات</button>
  <button type="button" data-nav="customers"><span class="ic">👥</span>العملاء</button>
  <button type="button" data-nav="more"><span class="ic">☰</span>المزيد</button>
</nav>

<script>
"use strict";
var API_BASE = "https://migoai-72.naroelwakel-dot.deno.net";
var API_HOME = API_BASE + "/control/home";
var KEY_SLOT = "migoControlAdminKey";

function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function fmtNum(n){
  var x = Number(n);
  if (!isFinite(x)) return "—";
  return x.toLocaleString("en-US", { maximumFractionDigits: 2 });
}
function relTime(iso){
  if (!iso) return null;
  var t = new Date(iso).getTime();
  if (!isFinite(t)) return null;
  var sec = Math.max(0, Math.floor((Date.now() - t) / 1000));
  if (sec < 60) return "دلوقتي";
  var min = Math.floor(sec / 60);
  if (min < 60) return "منذ " + min + (min === 1 ? " دقيقة" : " دقيقة");
  var hr = Math.floor(min / 60);
  if (hr < 24) return "منذ " + hr + (hr === 1 ? " ساعة" : " ساعة");
  var day = Math.floor(hr / 24);
  return "منذ " + day + (day === 1 ? " يوم" : " يوم");
}

function showMsg(kind, html, withKeyBtn){
  var box = $("msgBox");
  box.className = "msg " + kind;
  box.innerHTML = html + (withKeyBtn
    ? '<button class="btn" id="keyBtn" type="button">كتابة المفتاح</button>' : "");
  if (withKeyBtn) $("keyBtn").addEventListener("click", askKey);
}
function hideMsg(){ $("msgBox").className = "msg"; $("msgBox").innerHTML = ""; }

function getKey(){ try { return sessionStorage.getItem(KEY_SLOT) || ""; } catch(e){ return ""; } }
function setKey(k){ try {
  if (k) sessionStorage.setItem(KEY_SLOT, k); else sessionStorage.removeItem(KEY_SLOT);
} catch(e){} }
function askKey(){
  var k = window.prompt("اكتب مفتاح الأدمن:");
  if (k) { setKey(k.trim()); load(); }
}

function botCount(bot, key){
  if (!bot) return null;
  var src = (bot.queues && typeof bot.queues === "object") ? bot.queues : bot;
  var v = src[key];
  return (typeof v === "number" && isFinite(v)) ? v : null;
}

function compRow(name, okState, metaHtml){
  // okState: "ok" | "bad" | "warn"
  var word = okState === "ok" ? "يعمل" : (okState === "warn" ? "في مشكلة" : "غير متاح");
  var cls = okState === "ok" ? "ok" : (okState === "warn" ? "warn" : "bad");
  return '<div class="comp-row"><span class="dot ' + cls + '"></span>' +
    '<span class="name">' + esc(name) + '</span>' +
    '<span class="meta">' + word + "<br>" + metaHtml + "</span></div>";
}

function queueCard(label, sub, count, sev){
  if (count === null) {
    return '<div class="queue-card sev-' + sev + '"><div class="lbl">' + esc(label) +
      (sub ? "<small>" + esc(sub) + "</small>" : "") +
      '</div><div class="cnt na">غير متاح</div></div>';
  }
  if (count === 0) return "";
  return '<div class="queue-card sev-' + sev + '"><div class="lbl">' + esc(label) +
    (sub ? "<small>" + esc(sub) + "</small>" : "") +
    '</div><div class="cnt num">' + fmtNum(count) + "</div></div>";
}

function render(data){
  var store = data.store || {};
  var bot = data.bot || null;

  // شريط حالة المتجر
  $("storeDot").className = "dot ok";
  $("storePillText").textContent = "المتجر يعمل";

  // حالة الأجزاء
  var rows = "";
  var botAt = bot ? relTime(bot.generated_at) : null;
  rows += compRow("البوت",
    bot ? "ok" : "bad",
    bot ? ("آخر اتصال: <b>" + esc(botAt || "—") + "</b>")
        : "مش عارفين نوصله دلوقتي");
  var smsAt = relTime(store.latest_sms_at);
  rows += compRow("تطبيق قراءة رسائل التليفون",
    store.latest_sms_at ? "ok" : "warn",
    store.latest_sms_at
      ? ("آخر رسالة وصلت: <b>" + esc(smsAt || "—") + "</b>")
      : "لسه مفيش رسائل وصلت");
  var depAt = relTime(store.latest_deposit_at);
  rows += compRow("إيداعات Binance وBybit",
    store.latest_deposit_at ? "ok" : "warn",
    store.latest_deposit_at
      ? ("آخر إيداع وصل: <b>" + esc(depAt || "—") + "</b>")
      : "لسه مفيش إيداعات وصلت");
  $("compRows").innerHTML = rows;
  $("compCard").classList.remove("hidden");

  // طوابير «محتاج قرار الآن»
  var cards = "";
  cards += queueCard("شحنات منتظرة القرار", "شحنات محفظة البوت", botCount(bot, "pending_topups"), "amber");
  cards += queueCard("شحنات متعلمة بمشكلة", "رقم العملية اتستخدم قبل كده", botCount(bot, "flagged_topups"), "red");
  cards += queueCard("طلبات تحقق محتاجة مراجعة", "واقفة على قرار منك", botCount(bot, "sheerid_needs_review"), "red");
  cards += queueCard("طلبات فاشلة", "طلبات بوت محتاجة تدخل", botCount(bot, "failed_orders"), "red");
  cards += queueCard("محادثات من غير رد", "عملاء مستنيين رد", botCount(bot, "unanswered_chats"), "blue");
  cards += queueCard("طلبات يدوية", "تنفيذ يدوي عند مورد", botCount(bot, "manual_orders"), "purple");
  cards += queueCard("شحنات محفظة الموقع منتظرة القرار", "من صفحة المحفظة", (typeof store.pending_topups_count === "number") ? store.pending_topups_count : null, "amber");
  cards += queueCard("رسائل دفع لسه متربطتش", "وصلت ومتربطتش بشحنة ولا طلب", (typeof store.unmatched_sms === "number") ? store.unmatched_sms : null, "amber");
  cards += queueCard("إيداعات منصات لسه متربطتش", "وصلت ومتربطتش بشحنة ولا طلب", (typeof store.unmatched_exchange === "number") ? store.unmatched_exchange : null, "amber");
  cards += queueCard("طلبات موقع جديدة", "لسه ما اتنفذتش", (typeof store.new_orders === "number") ? store.new_orders : null, "blue");

  var wrap = $("queueWrap");
  if (cards) {
    wrap.innerHTML = cards;
  } else {
    wrap.innerHTML = '<div class="empty"><b>مفيش حاجة محتاجة تدخل</b>كل الطوابير فاضية دلوقتي.</div>';
  }
  wrap.classList.remove("hidden");

  // أحدث شحنات المحفظة المنتظرة
  var items = Array.isArray(store.pending_topups) ? store.pending_topups : [];
  var html = "";
  if (!items.length) {
    html = '<div class="sub">مفيش شحنات منتظرة.</div>';
  } else {
    items.forEach(function(t){
      var age = relTime(t.created_at);
      html += '<div class="topup-row">' +
        '<div class="amt num">' + fmtNum(t.amount_egp) + ' ج.م <small>' + esc(t.payment_method || "") + "</small></div>" +
        '<div class="sub">المُرسل: <b class="num">' + esc(t.sender_account || "—") + "</b>" +
        (t.transfer_ref ? ' · رقم العملية: <b class="num">' + esc(t.transfer_ref) + "</b>" : "") +
        (age ? " · " + esc(age) : "") + "</div></div>";
    });
  }
  $("topupRows").innerHTML = html;
  $("topupCard").classList.remove("hidden");

  // أحدث شحنات البوت المنتظرة (من نقطة البوت نفسها)
  var bItems = (bot && Array.isArray(bot.latest_topups)) ? bot.latest_topups : [];
  if (bItems.length) {
    var bHtml = "";
    bItems.forEach(function(t){
      var bAge = relTime(t.created_at);
      bHtml += '<div class="topup-row">' +
        '<div class="amt num">' + fmtNum(t.amount) + ' <small>' + esc(t.currency || "") +
        (t.method_label ? " · " + esc(t.method_label) : "") + "</small></div>" +
        '<div class="sub">العميل: <b class="num">' + esc(t.customer_ref || "—") + "</b>" +
        (t.ref_seen_before ? ' · <b style="color:var(--red)">رقم العملية اتشاف قبل كده</b>' : "") +
        (bAge ? " · " + esc(bAge) : "") + "</div></div>";
    });
    $("botTopupRows").innerHTML = bHtml;
    $("botTopupCard").classList.remove("hidden");
  }

  var gen = relTime(data.generated_at);
  $("updatedLine").textContent = "آخر تحديث: " + (gen || "دلوقتي");
}

function load(){
  var key = getKey();
  if (!key) { askKey(); return; }
  hideMsg();
  var btn = $("refreshBtn");
  btn.disabled = true; btn.textContent = "بيحمّل…";
  fetch(API_HOME, { headers: { "x-migo-admin": key } })
    .then(function(res){
      if (res.status === 401) {
        setKey("");
        $("storeDot").className = "dot bad";
        $("storePillText").textContent = "المفتاح غلط";
        showMsg("err", "مفتاح الأدمن غلط أو مش مكتوب. اكتبه تاني عشان اللوحة تفتح.", true);
        return null;
      }
      if (!res.ok) throw new Error("http " + res.status);
      return res.json();
    })
    .then(function(data){
      if (!data) return;

function showCustMsg(kind, html, withKeyBtn){
  var box = $("custMsg");
  box.className = "msg " + kind;
  box.innerHTML = html + (withKeyBtn
    ? '<button class="btn" id="custKeyBtn" type="button">كتابة المفتاح</button>' : "");
  if (withKeyBtn) $("custKeyBtn").addEventListener("click", askKey);
}
function hideCustMsg(){ $("custMsg").className = "msg"; $("custMsg").innerHTML = ""; }

// نداء واحد لكل نقاط قسم العملاء: بيبعت مفتاح الأدمن وبيفك الرد.
function api(path, opts){
  opts = opts || {};
  var key = getKey();
  if (!key) { askKey(); return Promise.reject({ noKey: true }); }
  var headers = { "x-migo-admin": key };
  var init = { method: opts.method || "GET", headers: headers };
  if (opts.body) {
    headers["Content-Type"] = "application/json";
    init.body = JSON.stringify(opts.body);
  }
  return fetch(API_BASE + path, init).then(function(res){
    return res.json().catch(function(){ return null; }).then(function(data){
      if (res.status === 401) {
        setKey("");
        var e401 = new Error("unauthorized"); e401.status = 401; e401.data = data;
        throw e401;
      }
      if (!res.ok || !data || data.ok === false) {
        var e = new Error("api error");
        e.status = res.status; e.data = data;
        throw e;
      }
      return data;
    });
  });
}

// ترجمة أخطاء الخادم لكلام واضح بالعربي حسب سياق العملية.
function errText(e, ctx){
  if (e && e.noKey) return "";
  if (e && e.userText) return e.userText;
  if (e && e.status === 401) return "مفتاح الأدمن غلط أو مش مكتوب. اكتبه تاني عشان تكمل.";
  var code = e && e.data && e.data.error;
  if (code === "already_decided") return "الشحنة دي اتقرر فيها قبل كده.";
  if (code === "insufficient") return "الرصيد مش هيكفي لتنفيذ العملية دي.";
  if (code === "already_reversed") return "القيد ده اتعكس قبل كده.";
  if (code === "bot_unavailable" || (e && e.data && e.data.bot_unavailable))
    return "البوت مش بيرد دلوقتي — حاول تاني بعد شوية.";
  if (code === "not_found" || (e && e.status === 404))
    return ctx === "reverse" ? "القيد ده مش موجود." : "العميل مش موجود.";
  if (e && e.status === 409)
    return ctx === "decide" ? "الشحنة دي اتقرر فيها قبل كده." : "القيد ده اتعكس قبل كده.";
  if (e && e.status === 422) return "الرصيد مش هيكفي لتنفيذ العملية دي.";
  if (e && e.status === 400) {
    if (ctx === "reverse") return "القيد ده نفسه عكس لقيد تاني، ومينفعش يتعكس.";
    return "فيه بيانات ناقصة أو مش صحيحة في الطلب.";
  }
  if (e && (e.status === 502 || e.status === 503)) return "الخدمة مش بترد دلوقتي — حاول تاني بعد شوية.";
  return "حصلت مشكلة ومش عارف أوصل للخادم. حاول تاني.";
}

function newIdem(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function(c){
    var r = Math.random() * 16 | 0, v = c === "x" ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
}
function egpFromMinor(v){
  if (v === null || v === undefined || v === "") return null;
  var n = Number(v);
  return isFinite(n) ? n / 100 : null;
}
function senderName(s){
  if (s === "customer") return "العميل";
  if (s === "bot") return "البوت";
  if (s === "admin") return "الأدمن";
  return s || "—";
}

var actCtx = null;
function openActSheet(title, bodyHtml, confirmLabel, onConfirm, errCtx){
  $("actTitle").textContent = title;
  $("actBody").innerHTML = bodyHtml;
  var m = $("actMsg"); m.className = "msg"; m.innerHTML = "";
  var c = $("actConfirm");
  c.textContent = confirmLabel || "تأكيد"; c.disabled = false;
  // مفتاح منع التكرار بيتولد مع فتح الورقة وبيفضل ثابت مع إعادة
  // المحاولة لنفس النية، فالضغطة التانية ما تعملش العملية مرتين.
  actCtx = { idem: newIdem(), onConfirm: onConfirm, errCtx: errCtx || "", confirmLabel: confirmLabel || "تأكيد" };
  $("actSheet").classList.add("open");
  $("actVeil").classList.add("open");
  return actCtx;
}
function closeActSheet(){
  $("actSheet").classList.remove("open");
  $("actVeil").classList.remove("open");
  actCtx = null;
}
function actError(text){
  var m = $("actMsg");
  m.className = "msg err";
  m.textContent = text;
}
$("actCancel").addEventListener("click", closeActSheet);
$("actVeil").addEventListener("click", closeActSheet);
$("actConfirm").addEventListener("click", function(){
  if (!actCtx || !actCtx.onConfirm) return;
  var ctx = actCtx;
  var c = $("actConfirm");
  c.disabled = true; c.textContent = "بيتنفذ…";
  Promise.resolve().then(ctx.onConfirm).then(function(){
    closeActSheet();
  }).catch(function(e){
    if (e && e.noKey) { closeActSheet(); return; }
    if (e && e.status === 401) {
      closeActSheet();
      showCustMsg("err", "مفتاح الأدمن غلط أو مش مكتوب. اكتبه تاني عشان تكمل.", true);
      return;
    }
    c.disabled = false; c.textContent = ctx.confirmLabel;
    actError(errText(e, ctx.errCtx));
  });
});
function failValidation(text){
  var e = new Error("validation");
  e.userText = text;
  throw e;
}

function doSearch(){
  var q = $("custQ").value.trim();
  if (!q) { showCustMsg("err", "اكتب معرّف الأول: رقم عميل، إيميل، رقم عملية، أو رقم طلب."); return; }
  hideCustMsg();

  $("custResults").innerHTML = '<div class="sub" style="color:var(--muted)">بندوّر…</div>';

  api("/control/customers/search?q=" + encodeURIComponent(q))
    .then(function(data){
      custState.bot = Array.isArray(data.bot) ? data.bot : [];
      custState.store = Array.isArray(data.store) ? data.store : [];
      renderResults(data);
    })
    .catch(function(e){
      if (e && e.noKey) { $("custResults").innerHTML = ""; return; }
      if (e && e.status === 401) {
        showCustMsg("err", "مفتاح الأدمن غلط أو مش مكتوب. اكتبه تاني عشان تكمل.", true);

    html += '<div class="sub" style="color:var(--amber); padding:8px 0;">البوت مش بيرد دلوقتي — نتائج الموقع بس هي اللي ظاهرة.</div>';

    html += '<div class="result-row" data-open-bot="' + i + '">' +
      '<div class="who"><b class="num">' + esc(r.ref || "—") + ' <span class="badge bot">بوت</span></b>' +

      '<div class="bal num">' + fmtNum(r.balance_egp) + ' <small>ج.م</small></div></div>';
  });

    var label = r.email || r.id || r.customer_id || "—";
    html += '<div class="result-row" data-open-store="' + i + '">' +
      '<div class="who"><b>' + esc(label) + ' <span class="badge store">موقع</span></b>' +
      "<small>حساب موقع</small></div>" +
      ((r.balance_egp !== null && r.balance_egp !== undefined && r.balance_egp !== "")
        ? '<div class="bal num">' + fmtNum(r.balance_egp) + ' <small>ج.م</small></div>' : "") +
      "</div>";
  });
  if (!custState.bot.length && !custState.store.length) {
    html += '<div class="empty"><b>مفيش نتائج</b>مفيش عميل بالمعرّف ده في البوت ولا في الموقع.</div>';
  }
  $("custResults").innerHTML = html;
  $("custResults").querySelectorAll("[data-open-bot]").forEach(function(el){
    el.addEventListener("click", function(){
      openCustomer("bot", custState.bot[Number(el.getAttribute("data-open-bot"))]);

  $("custResults").querySelectorAll("[data-open-store]").forEach(function(el){

var custFile = { bot: null, store: null, botRef: "", storeId: "", storeEmail: "" };

function openCustomer(surface, item){
  if (!item) return;
  custFile = { bot: null, store: null, botRef: "", storeId: "", storeEmail: "" };
  hideCustMsg();
  var wrap = $("custFile");
  wrap.classList.remove("hidden");
  wrap.innerHTML = '<div class="empty">بيحمّل ملف العميل…</div>';
  wrap.scrollIntoView({ behavior: "smooth", block: "start" });
  if (surface === "bot") {
    custFile.botRef = String(item.ref || "");
    api("/control/bot-customer?ref=" + encodeURIComponent(custFile.botRef))
      .then(function(d){ custFile.bot = d; renderFile(); })
      .catch(function(e){ fileLoadError(e); });
  } else {
    custFile.storeId = String(item.id || item.customer_id || "");
    custFile.storeEmail = String(item.email || "");
    var path = custFile.storeId
      ? "/control/store-customer?id=" + encodeURIComponent(custFile.storeId)
      : "/control/store-customer?email=" + encodeURIComponent(custFile.storeEmail);
    api(path)
      .then(function(d){
        custFile.store = d;
        if (d.customer && d.customer.id) custFile.storeId = String(d.customer.id);
        if (d.customer && d.customer.email) custFile.storeEmail = String(d.customer.email);
        renderFile();
      })
      .catch(function(e){ fileLoadError(e); });
  }
}
function fileLoadError(e){
  var wrap = $("custFile");
  wrap.classList.add("hidden");
  wrap.innerHTML = "";
  if (e && e.noKey) return;
  if (e && e.status === 401) {
    showCustMsg("err", "مفتاح الأدمن غلط أو مش مكتوب. اكتبه تاني عشان تكمل.", true);
    return;
  }
  showCustMsg("err", errText(e, "file"));
}
// إعادة تحميل سطح واحد بعد أي فعل، عشان الأرقام اللي تظهر تبقى من الخادم.
function reloadSurface(surface){
  if (surface === "bot" && custFile.botRef) {
    return api("/control/bot-customer?ref=" + encodeURIComponent(custFile.botRef))
      .then(function(d){ custFile.bot = d; renderFile(); });
  }
  if (surface === "store" && (custFile.storeId || custFile.storeEmail)) {
    var path = custFile.storeId
      ? "/control/store-customer?id=" + encodeURIComponent(custFile.storeId)
      : "/control/store-customer?email=" + encodeURIComponent(custFile.storeEmail);
    return api(path).then(function(d){ custFile.store = d; renderFile(); });
  }
  return Promise.resolve();
}

  var list = (custFile.bot && Array.isArray(custFile.bot.orders)) ? custFile.bot.orders : [];
  if (!custFile.bot) return "";
  var rows = "";
  if (!list.length) rows = '<div class="sub" style="color:var(--muted)">مفيش طلبات.</div>';
  list.forEach(function(o){
    var age = relTime(o.created_at);
    rows += '<div class="topup-row">' +
      '<div class="amt num">' + fmtNum(egpFromMinor(o.total)) + ' ج.م <small>' + esc(o.product_name || "") + "</small></div>" +
      '<div class="sub">' + statusTxt({}, o.status) + (age ? " · " + esc(age) : "") + "</div></div>";
  });
  return '<section class="card"><h2>طلبات البوت</h2>' + rows + "</section>";
}

  if (!custFile.store) return "";
  var rows = "";
  if (!list.length) rows = '<div class="sub" style="color:var(--muted)">مفيش طلبات.</div>';

function botSheerHtml(){

  if (!custFile.bot || !list.length) return "";
  var rows = "";
  list.forEach(function(j){

function renderFile(){
  var wrap = $("custFile");
  var bot = custFile.bot, store = custFile.store;
  if (!bot && !store) { wrap.classList.add("hidden"); wrap.innerHTML = ""; return; }
  var html = '<button class="btn secondary back" type="button" id="fileBack">رجوع لنتائج البحث</button>';

  // رأسيّة الهوية من السطح المحمّل
  html += '<section class="card"><h2>ملف العميل</h2>';
  if (bot) {
    html += '<div class="sub">رقم العميل (تليجرام): <b class="num">' + esc(bot.customer.ref || custFile.botRef) + '</b> <span class="badge bot">بوت</span></div>';
    var conv = bot.conversation || {};
    var lastAge = relTime(conv.last_at);
    if (conv.last_at) {
      html += '<div class="sub">آخر تفاعل: رسالة من ' + esc(senderName(conv.last_sender)) + (lastAge ? " · " + esc(lastAge) : "") + "</div>";
    } else {
      html += '<div class="sub">آخر تفاعل: مفيش محادثات مسجلة.</div>';
    }
    if (bot.customer.wallet_created_at) {
      var wc = relTime(bot.customer.wallet_created_at);
      html += '<div class="sub">المحفظة اتعملت: ' + esc(wc || "") + "</div>";
    }
  }
  if (store) {
    html += '<div class="sub">حساب الموقع: <b>' + esc(store.customer.email || store.customer.id || "") + '</b> <span class="badge store">موقع</span></div>';
    if (store.customer.email && store.customer.id) {
      html += '<div class="sub">رقم الحساب: <b class="num">' + esc(store.customer.id) + "</b></div>";
    }
  }
  html += "</section>";

  html += walletCardHtml("bot");
  html += walletCardHtml("store");
  html += botTopupsHtml();
  html += storeTopupsHtml();
  html += botLedgerHtml();
  html += storeLedgerHtml();
  html += botOrdersHtml();
  html += storeOrdersHtml();
  html += botSheerHtml();

  wrap.innerHTML = html;
  wrap.classList.remove("hidden");

  $("fileBack").addEventListener("click", function(){
    wrap.classList.add("hidden");
    wrap.innerHTML = "";
    custFile = { bot: null, store: null, botRef: "", storeId: "", storeEmail: "" };
    $("custSearchCard").scrollIntoView({ behavior: "smooth", block: "start" });
  });
  wrap.querySelectorAll("[data-adjust]").forEach(function(b){
    b.addEventListener("click", function(){ openAdjust(b.getAttribute("data-adjust"), null); });
  });
  var tr = wrap.querySelector("[data-transfer]");
  if (tr) tr.addEventListener("click", openTransfer);
  wrap.querySelectorAll("[data-bdecide]").forEach(function(b){
    b.addEventListener("click", function(){
      var t = custFile.bot.topups[Number(b.getAttribute("data-bidx"))];
      openDecide("bot", t, b.getAttribute("data-bdecide"));
    });
  });
  wrap.querySelectorAll("[data-sdecide]").forEach(function(b){
    b.addEventListener("click", function(){
      var t = custFile.store.topups[Number(b.getAttribute("data-sidx"))];
      openDecide("store", t, b.getAttribute("data-sdecide"));
    });
  });
  wrap.querySelectorAll("[data-breverse]").forEach(function(b){
    b.addEventListener("click", function(){
      openBotReverse(custFile.bot.ledger[Number(b.getAttribute("data-breverse"))]);
    });
  });
  wrap.querySelectorAll("[data-sreverse]").forEach(function(b){
    b.addEventListener("click", function(){
      openStoreReverse(custFile.store.transactions[Number(b.getAttribute("data-sreverse"))]);
    });
  });
}

// ---------------- قرار شحنة ----------------
var DECIDE_LABEL = { approve: "قبول الشحنة", reject: "رفض الشحنة", needs_info: "طلب بيانات أكتر" };
function openDecide(surface, t, action){
  if (!t) return;
  var isBot = surface === "bot";
  var amt = isBot ? egpFromMinor(t.amount) : Number(t.amount_egp);
  var method = isBot ? (t.method_label || "") : (t.payment_method || "");
  var body = '<div class="preview">المبلغ: <b class="num">' + fmtNum(amt) + " ج.م</b>" +
    (method ? " · " + esc(method) : "") +
    (isBot && t.operation_ref ? '<br>رقم العملية: <b class="num">' + esc(t.operation_ref) + "</b>" : "") +
    (!isBot && t.sender_account ? '<br>المُرسل: <b class="num">' + esc(t.sender_account) + "</b>" : "") +
    "</div>" +
    '<div class="field"><label>ملحوظة (اختياري)</label><input id="decNote" type="text"></div>';
  openActSheet(DECIDE_LABEL[action] || "قرار شحنة", body, "تنفيذ القرار", function(){
    var note = $("decNote").value.trim();
    var payload, path;
    if (isBot) {
      path = "/control/bot-topup-decide";
      payload = { request_id: t.id, action: action };
    } else {
      path = "/control/store-topup-decide";
      payload = { topup_id: t.id, action: action };
    }
    if (note) payload.note = note;
    return api(path, { method: "POST", body: payload }).then(function(){
      return reloadSurface(surface);
    }).then(function(){
      showCustMsg("ok", "اتنفذ: " + (DECIDE_LABEL[action] || "القرار") + " — الأرقام اللي تحت دي من الخادم بعد التنفيذ.");
    });
  }, "decide");
}

// ---------------- تعديل الرصيد ----------------
function openAdjust(surface, preset){
  var isBot = surface === "bot";
  var data = isBot ? custFile.bot : custFile.store;
  if (!data) return;
  var bal = Number(data.customer.balance_egp);
  var who = isBot ? ("عميل البوت " + (data.customer.ref || custFile.botRef)) : ("حساب الموقع " + (data.customer.email || data.customer.id || ""));
  var body =
    '<div class="preview">العميل: <b>' + esc(who) + '</b><br>الرصيد دلوقتي: <b class="num">' + fmtNum(bal) + ' ج.م</b></div>' +
    '<div class="field"><label>نوع التعديل</label><div class="seg" id="adjSeg">' +
    '<button type="button" data-mode="add">إضافة</button>' +
    '<button type="button" data-mode="deduct">خصم</button>' +
    '<button type="button" data-mode="set">اضبط على</button></div></div>' +
    '<div class="field"><label id="adjAmtLbl">المبلغ (ج.م)</label><input id="adjAmt" type="number" inputmode="decimal" min="0" step="0.01"></div>' +
    '<div class="field"><label>نوع القيد</label><select id="adjKind">' +
    '<option value="deposit">إيداع</option><option value="compensation">تعويض</option><option value="correction">تصحيح</option></select></div>' +
    '<div class="field"><label>السبب (إلزامي)</label><input id="adjReason" type="text"></div>' +
    '<div class="preview" id="adjPreview"></div>';
  var ctx = openActSheet(isBot ? "تعديل رصيد محفظة البوت" : "تعديل رصيد محفظة الموقع", body, "تنفيذ التعديل", function(){
    var amt = parseFloat($("adjAmt").value);
    var kind = $("adjKind").value;
    var reason = $("adjReason").value.trim();
    if (!isFinite(amt)) failValidation("اكتب مبلغ صحيح.");
    if (mode === "set" ? amt < 0 : amt <= 0) failValidation(mode === "set" ? "الرصيد الجديد مينفعش يكون بالسالب." : "المبلغ لازم يكون أكبر من صفر.");
    if (!reason) failValidation("السبب إلزامي — اكتب سبب التعديل.");
    var payload, path;
    if (isBot) {
      path = "/control/bot-wallet-adjust";
      payload = { customer_ref: data.customer.ref || custFile.botRef, mode: mode, kind: kind, reason: reason, idempotency_key: ctx.idem };
    } else {
      path = "/control/store-wallet-adjust";
      payload = { customer_id: data.customer.id || custFile.storeId, mode: mode, kind: kind, reason: reason, idempotency_key: ctx.idem };
    }
    if (mode === "set") payload.target_egp = amt; else payload.amount_egp = amt;
    return api(path, { method: "POST", body: payload }).then(function(){
      return reloadSurface(surface);
    }).then(function(){
      showCustMsg("ok", "اتنفذ تعديل الرصيد — الرصيد اللي تحت ده من الخادم بعد التنفيذ.");
    });
  }, "adjust");

  var mode = (preset && preset.mode) || "add";
  var segBtns = $("adjSeg").querySelectorAll("button");
  function paintSeg(){
    segBtns.forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-mode") === mode); });
    $("adjAmtLbl").textContent = mode === "set" ? "الرصيد الجديد (ج.م)" : "المبلغ (ج.م)";
    updPreview();
  }
  function updPreview(){
    var amt = parseFloat($("adjAmt").value);
    var el = $("adjPreview");
    if (!isFinite(amt)) {
      el.innerHTML = 'الرصيد دلوقتي: <b class="num">' + fmtNum(bal) + ' ج.م</b> — اكتب مبلغ عشان تشوف الرصيد بعد التنفيذ.';
      return;
    }
    var after = mode === "add" ? bal + amt : (mode === "deduct" ? bal - amt : amt);
    el.innerHTML = 'قبل: <b class="num">' + fmtNum(bal) + ' ج.م</b> ← بعد: <b class="num">' + fmtNum(after) + ' ج.م</b>' +
      (after < 0 ? '<br><span class="warn">الرصيد مش هيكفي — الخادم هيرفض العملية.</span>' : "");
  }
  segBtns.forEach(function(b){
    b.addEventListener("click", function(){ mode = b.getAttribute("data-mode"); paintSeg(); });
  });
  $("adjAmt").addEventListener("input", updPreview);
  if (preset) {
    mode = preset.mode || mode;
    if (typeof preset.amount === "number") $("adjAmt").value = preset.amount;
    if (preset.kind) $("adjKind").value = preset.kind;
    if (preset.reason) $("adjReason").value = preset.reason;
  }
  paintSeg();
}

// ---------------- نقل بين عميلين (بوت بس) ----------------
function openTransfer(){
  var data = custFile.bot;
  if (!data) return;
  var bal = Number(data.customer.balance_egp);
  var fromRef = data.customer.ref || custFile.botRef;
  var body =
    '<div class="preview">من عميل البوت: <b class="num">' + esc(fromRef) + '</b><br>رصيده دلوقتي: <b class="num">' + fmtNum(bal) + ' ج.م</b></div>' +
    '<div class="field"><label>رقم العميل التاني (تليجرام)</label><input id="trTo" type="text" inputmode="numeric"></div>' +
    '<div class="field"><label>المبلغ (ج.م)</label><input id="trAmt" type="number" inputmode="decimal" min="0" step="0.01"></div>' +
    '<div class="field"><label>السبب (إلزامي)</label><input id="trReason" type="text"></div>' +
    '<div class="preview" id="trPreview"></div>';
  var ctx = openActSheet("نقل رصيد لعميل تاني", body, "تنفيذ النقل", function(){
    var to = $("trTo").value.trim();
    var amt = parseFloat($("trAmt").value);
    var reason = $("trReason").value.trim();
    if (!to) failValidation("اكتب رقم العميل التاني.");
    if (to === String(fromRef)) failValidation("مينفعش تنقل لنفس العميل.");
    if (!isFinite(amt) || amt <= 0) failValidation("اكتب مبلغ صحيح أكبر من صفر.");
    if (!reason) failValidation("السبب إلزامي — اكتب سبب النقل.");
    return api("/control/bot-wallet-transfer", { method: "POST", body: {
      from_ref: fromRef, to_ref: to, amount_egp: amt, reason: reason, idempotency_key: ctx.idem
    } }).then(function(){
      return reloadSurface("bot");
    }).then(function(){
      showCustMsg("ok", "اتنفذ النقل — رصيد العميل اللي تحت ده من الخادم بعد التنفيذ.");
    });
  }, "transfer");
  function upd(){
    var amt = parseFloat($("trAmt").value);
    var el = $("trPreview");
    if (!isFinite(amt)) { el.innerHTML = "اكتب مبلغ عشان تشوف رصيد العميل ده بعد النقل."; return; }
    var after = bal - amt;
    el.innerHTML = 'رصيد العميل ده بعد النقل: <b class="num">' + fmtNum(after) + ' ج.م</b>' +
      (after < 0 ? '<br><span class="warn">الرصيد مش هيكفي — الخادم هيرفض العملية.</span>' : "");
  }
  $("trAmt").addEventListener("input", upd);
  upd();
}

// ---------------- عكس قيد ----------------
function openBotReverse(tx){
  if (!tx) return;
  var data = custFile.bot;
  var amt = egpFromMinor(tx.amount);
  var body =
    '<div class="preview">القيد: <b>' + esc(BOT_KIND[tx.kind] || tx.kind || "") + '</b> بمبلغ <b class="num">' + fmtNum(amt) + ' ج.م</b>' +
    (tx.note ? "<br>" + esc(tx.note) : "") +
    "<br>العكس هيعمل قيد معاكس بنفس المبلغ على محفظة العميل.</div>" +
    '<div class="field"><label>سبب العكس (إلزامي)</label><input id="revReason" type="text"></div>';
  var ctx = openActSheet("عكس قيد محفظة البوت", body, "تنفيذ العكس", function(){
    var reason = $("revReason").value.trim();
    if (!reason) failValidation("سبب العكس إلزامي.");
    return api("/control/bot-wallet-reverse", { method: "POST", body: {
      customer_ref: data.customer.ref || custFile.botRef, tx_id: tx.id, reason: reason, idempotency_key: ctx.idem
    } }).then(function(){
      return reloadSurface("bot");
    }).then(function(){
      showCustMsg("ok", "اتنفذ عكس القيد — القيود اللي تحت دي من الخادم بعد التنفيذ.");
    });
  }, "reverse");
}
function openStoreReverse(tx){
  if (!tx) return;
  var amt = Number(tx.amount_egp);
  // قيود الشحن قيمتها موجبة، وقيود التعديل اليدوي قيمتها بسالب أو موجب
  // حسب الاتجاه — العكس بيتم بتعديل معاكس بنفس القيمة المطلقة.
  var signed = tx.kind === "topup" ? Math.abs(amt) : amt;
  var preset = {
    mode: signed > 0 ? "deduct" : "add",
    amount: Math.abs(signed),
    kind: "correction",
    reason: "عكس قيد" + (tx.ref ? " — رقم العملية: " + tx.ref : "")
  };
  openAdjust("store", preset);
}

load();
