<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>tailwind-build</title>
</head>
<body>
<pre id="status">BOOT</pre>
<p><a id="dl" download="tailwind.css" style="display:none">Download tailwind.css</a></p>
<pre id="out"></pre>
<iframe id="store" src="index.html" style="width:1300px;height:900px;border:0"></iframe>
<script>
(function(){
  var f = document.getElementById('store');
  var status = document.getElementById('status');
  var out = document.getElementById('out');
  var B64 = '', CH = [];
  var want = parseInt((location.hash||'').replace('#',''),10) || 0;
  var last = -1, stable = 0;

  function allCss(doc){
    var s='', ss=doc.querySelectorAll('style');
    for (var i=0;i<ss.length;i++) s += (ss[i].textContent||'') + '\n';
    return s;
  }
  function totalLen(doc){
    var t=0, ss=doc.querySelectorAll('style');
    for (var i=0;i<ss.length;i++) t += (ss[i].textContent||'').length;
    return t;
  }
  function toB64(s){
    try { return btoa(s); }
    catch(e){ return btoa(unescape(encodeURIComponent(s))); }
  }
  function chunkify(s,size){
    var a=[]; for (var i=0;i<s.length;i+=size) a.push(s.slice(i,i+size)); return a;
  }
  function render(){
    var i = Math.min(want, CH.length-1);
    out.textContent = '@@TW'+i+'/'+(CH.length-1)+'@@\n' + CH[i];
    status.textContent = 'READY b64len='+B64.length+' chunks='+CH.length+' show='+i;
  }
  function tick(){
    if(!f.contentDocument){ status.textContent='NO-DOC'; return; }
    var len = totalLen(f.contentDocument);
    if(len === last && len > 5000){ stable++; } else { stable=0; }
    last = len;
    status.textContent = 'len='+len+' stable='+stable;
    if(stable >= 3){ done(); return; }
    setTimeout(tick, 1000);
  }
  function done(){
    var css = allCss(f.contentDocument);
    B64 = toB64(css);
    CH = chunkify(B64, 4000);
    try {
      var blob = new Blob([css], {type:'text/css'});
      var a = document.getElementById('dl');
      a.href = URL.createObjectURL(blob);
      a.style.display = 'inline-block';
    } catch(e){}
    f.parentNode.removeChild(f);
    render();
  }
  window.addEventListener('hashchange', function(){
    want = parseInt((location.hash||'').replace('#',''),10) || 0;
    if (CH.length) render();
  });
  f.addEventListener('load', function(){ setTimeout(tick, 1500); });
})();
</script>
</body>
</html>
