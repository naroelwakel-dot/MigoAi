<!doctype html><html><head><meta charset="utf-8"><title>lcp-probe</title>
<meta name="robots" content="noindex, nofollow">
<style>body{margin:0;background:#111;color:#eee;font:12px monospace}#f{width:412px;height:823px;border:1px solid #444;background:#000}</style>
</head><body>
<pre id="out" style="white-space:pre-wrap;padding:6px"></pre>
<iframe id="f" src="index.html?lcp=9"></iframe>
<script>
var f=document.getElementById('f'), out=document.getElementById('out');
f.addEventListener('load',function(){
  var w=f.contentWindow, d=f.contentDocument;
  try{
    w.eval("window.__lcp=[];try{new PerformanceObserver(function(l){l.getEntries().forEach(function(e){var el=e.element;window.__lcp.push({t:Math.round(e.startTime),size:e.size,url:e.url||'',el:el?(el.tagName+(el.id?'#'+el.id:'')+(el.className?'.'+String(el.className).trim().split(/\\s+/)[0]:'')):'?'});});}).observe({type:'largest-contentful-paint',buffered:true});}catch(err){window.__lcp.push({err:''+err});}");
  }catch(e){ out.textContent='ERR '+e; }
  setTimeout(function(){ var s; try{s=JSON.stringify(w.__lcp,null,1);}catch(e){s='read '+e;} out.textContent='LCP '+s; }, 11000);
});
</script>
</body></html>
