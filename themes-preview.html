<!doctype html>
<html lang="ar" dir="rtl" class="dark">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>10 ألوان للصفحة (نماذج مرئية) | Migo AI Solution</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    html,body{margin:0;overflow-x:hidden;background:#05070b;font-family:'Tajawal',sans-serif;letter-spacing:-.015em}
    .font-mono-code{font-family:'JetBrains Mono',monospace}
    .pagehead{max-width:1120px;margin:0 auto;padding:18px 16px 6px;text-align:center;color:#e8ecf4}
    .pagehead h1{font-size:20px;margin:0 0 4px}
    .pagehead p{font-size:12.5px;color:#98a2b3;margin:0}
    .grid{max-width:1120px;margin:0 auto;padding:12px 16px 40px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
    @media(max-width:760px){.grid{grid-template-columns:1fr}}

    .board{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:16px;overflow:hidden}
    .bh{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--panel)}
    .bh .nm{font-weight:800;font-size:13.5px}
    .bh .sws{display:flex;gap:5px}
    .bh .sws i{width:13px;height:13px;border-radius:99px;display:inline-block;border:1px solid rgba(255,255,255,.18)}

    .bhero{position:relative;height:132px;display:flex;align-items:center;justify-content:center;overflow:hidden}
    .bhero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .bhero .v{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,8,12,.45),rgba(6,8,12,.85))}
    .bhero .c{position:relative;z-index:2;text-align:center;color:#fff;padding:0 12px}
    .bbadge{display:inline-block;border:1px solid var(--accent);color:#fff;background:rgba(0,0,0,.3);border-radius:99px;padding:2px 10px;font-size:9.5px;font-weight:700;margin-bottom:5px}
    .bhero h4{margin:0 0 7px;font-size:15px}
    .bcta{background:var(--accent);color:var(--chip);border:0;border-radius:9px;padding:6px 16px;font-weight:800;font-size:11.5px;cursor:pointer}

    .bpills{display:flex;gap:6px;padding:10px 12px 0}
    .bpills span{font-size:10.5px;color:var(--muted);border:1px solid var(--border);border-radius:8px;padding:4px 9px}
    .bpills span:first-child{color:var(--text);border-color:var(--accent)}

    .bprod{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 12px 12px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
    .bprod .t{font-size:12.5px;font-weight:700}
    .bprod .s{font-size:10px;color:var(--muted)}
    .bprod .pr{font-weight:800;color:var(--accent);font-size:12.5px}
    .bprod .buy{background:var(--elev);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:5px 12px;font-size:11px;font-weight:700;cursor:pointer}
  </style>
 </head>
 <body>
  <div class="pagehead">
   <h1>ألوان للصفحة — نماذج مرئية</h1>
   <p>نفس العناصر (هيدر + هيرو التنين + أزرار + منتج) بكل لون. بدون أزرق وبدون بنفسجى. قول رقم أو اسم اللي يعجبك.</p>
  </div>
  <div class="grid" id="grid"></div>

  <script>
    var DRAGON = "https://cdn-public.eesel.ai/0cbaf9ba-8014-447a-b542-35590921b469/f5283076-5741-4392-be55-32f19bc3b411/2c2a6dc93e854b44989d41acd8e2deed.png";
    var P = [
     {n:'1) أبيض نهارى (أحمر)',      bg:'#f7f8fa', panel:'#ffffff', card:'#ffffff', elev:'#eef1f5', accent:'#e11d48', text:'#0f172a', muted:'#64748b', chip:'#ffffff', border:'rgba(15,23,42,.10)'},
     {n:'2) أسود وذهبى',             bg:'#0c0a06', panel:'#15110a', card:'#1a150d', elev:'#241d10', accent:'#d4af37', text:'#f7f2e6', muted:'#b9ad8f', chip:'#0c0a06', border:'rgba(255,215,130,.20)'},
     {n:'3) برتقالى نارى',           bg:'#140a04', panel:'#1e1008', card:'#25140b', elev:'#311b0f', accent:'#f97316', text:'#fff3e9', muted:'#c8a48e', chip:'#140a04', border:'rgba(255,150,70,.22)'},
     {n:'4) أخضر زمردى',            bg:'#04120d', panel:'#0a1c15', card:'#0d241b', elev:'#123328', accent:'#10b981', text:'#e7f7f1', muted:'#86b3a5', chip:'#04120d', border:'rgba(255,255,255,.10)'},
     {n:'5) نعناع فاتح (أخضر)',      bg:'#eefaf4', panel:'#ffffff', card:'#ffffff', elev:'#e0f3ea', accent:'#059669', text:'#06251b', muted:'#5f7d72', chip:'#ffffff', border:'rgba(6,70,50,.12)'},
     {n:'6) كريمى دافئ (عنبر)',      bg:'#faf6ef', panel:'#fffdf8', card:'#f6efe3', elev:'#efe4d2', accent:'#b45309', text:'#2b1d0e', muted:'#7c6a52', chip:'#fffdf8', border:'rgba(120,80,20,.18)'},
     {n:'7) وردى فاتح',              bg:'#fdf2f6', panel:'#ffffff', card:'#fff5f8', elev:'#fde3ee', accent:'#db2777', text:'#3b0a1e', muted:'#8a5a6e', chip:'#ffffff', border:'rgba(190,24,93,.16)'},
     {n:'8) بورجندى (أحمر داكن)',    bg:'#140609', panel:'#1e0a10', card:'#250c13', elev:'#310f19', accent:'#e0405f', text:'#fdeef1', muted:'#c69aa4', chip:'#140609', border:'rgba(255,255,255,.10)'},
     {n:'9) أسود وفضى (جرافيت)',     bg:'#0c0d0f', panel:'#131519', card:'#171a1f', elev:'#20242b', accent:'#e2e8f0', text:'#eef1f5', muted:'#9aa3ad', chip:'#0c0d0f', border:'rgba(255,255,255,.12)'},
     {n:'10) شوكولاتى دافئ (كراميل)', bg:'#17110c', panel:'#211811', card:'#291d14', elev:'#372719', accent:'#d99a54', text:'#f7ede2', muted:'#bda489', chip:'#17110c', border:'rgba(217,154,84,.22)'},
     {n:'11) برتقالى نار + أبيض (مدمج)', bg:'#fff8f3', panel:'#ffffff', card:'#fff3ea', elev:'#ffe7d6', accent:'#f97316', text:'#3a1a06', muted:'#8a6a55', chip:'#ffffff', border:'rgba(249,115,22,.20)'},
     {n:'12) برتقالى نار + أبيض (تباين)', bg:'#ffffff', panel:'#fffaf6', card:'#ffffff', elev:'#fff0e0', accent:'#ea580c', text:'#1c1008', muted:'#7a6a5c', chip:'#ffffff', border:'rgba(234,88,12,.16)'}
    ];
    var g = document.getElementById('grid');
    P.forEach(function(p){
      var b = document.createElement('div');
      b.className = 'board';
      b.style.cssText = '--bg:'+p.bg+';--panel:'+p.panel+';--card:'+p.card+';--elev:'+p.elev+';--accent:'+p.accent+';--text:'+p.text+';--muted:'+p.muted+';--chip:'+p.chip+';--border:'+p.border;
      b.innerHTML =
        '<div class="bh"><span class="nm">'+p.n+'</span><span class="sws">'+
          '<i style="background:'+p.bg+'"></i><i style="background:'+p.panel+'"></i><i style="background:'+p.card+'"></i>'+
          '<i style="background:'+p.accent+'"></i><i style="background:'+p.text+'"></i></span></div>'+
        '<div class="bhero"><img src="'+DRAGON+'" alt=""><div class="v"></div><div class="c">'+
          '<span class="bbadge font-mono-code">VERIFIED CREDITS</span>'+
          '<h4>شحن كوينز تيك توك الرسمية</h4>'+
          '<button class="bcta">اشحن الآن ⚡</button></div></div>'+
        '<div class="bpills"><span>الألعاب</span><span>الاشتراكات</span><span>السوشيال</span></div>'+
        '<div class="bprod"><div><div class="t">ببجي موبايل (3850 UC)</div><div class="s">شحن مباشر بالـ ID</div></div>'+
          '<div style="display:flex;align-items:center;gap:10px"><span class="pr font-mono-code">3,100 ج.م</span><button class="buy">اشحن</button></div></div>';
      g.appendChild(b);
    });
  </script>
 </body>
</html>
